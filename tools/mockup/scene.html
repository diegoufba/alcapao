<!doctype html>
<html><head><meta charset="utf-8">
<style>

<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
const q = new URLSearchParams(location.search);
const mode = q.get('mode') || 'count';
const pts = q.get('pts') === '1';
const W = +(q.get('w') || 1280), H = +(q.get('h') || 720);
await document.fonts.load('40px Bungee'); await document.fonts.load('600 40px Rubik'); await document.fonts.load('500 40px Rubik');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: mode === 'char', preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
if (mode !== 'char') { scene.background = new THREE.Color('#0E1120'); scene.fog = new THREE.Fog('#0E1120', 26, 48); }

const ACC = '#FFC83D';
const mat = (c, o = {}) => new THREE.MeshLambertMaterial({ color: c, flatShading: true, ...o });
const shadow = (m) => { m.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); return m; };

// ---------- character ----------
const PLAYERS = {
  P1: { c: '#4C8DFF', s: '#2F5FC0', hair: '#4A2E1C' },
  P2: { c: '#FF8A3D', s: '#C45E1E', hair: '#1E1A16' },
  P3: { c: '#3DDC97', s: '#22A06A', hair: '#8A5A2B' },
  P4: { c: '#E06CF5', s: '#A645BB', hair: '#2B2233' },
};
function makeChar(id, pose = 'idle') {
  const P = PLAYERS[id];
  const g = new THREE.Group();
  const skin = mat('#F2C9A0'), shirt = mat(P.c), dark = mat('#2A2F4A'), shoe = mat('#1A1A2E'), white = mat('#F4F5FF');
  // legs
  for (const x of [-0.17, 0.17]) {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.12, 0.42, 6), dark); leg.position.set(x, 0.3, 0); g.add(leg);
    const sh = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.14, 0.34), shoe); sh.position.set(x, 0.07, 0.05); g.add(sh);
  }
  // body
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.36, 0.6, 7), shirt); body.position.y = 0.78; g.add(body);
  const stripe = new THREE.Mesh(new THREE.CylinderGeometry(0.305, 0.33, 0.1, 7), white); stripe.position.y = 0.7; g.add(stripe);
  // arms
  const armGeo = new THREE.CylinderGeometry(0.08, 0.09, 0.46, 6);
  for (const s of [-1, 1]) {
    const pivot = new THREE.Group(); pivot.position.set(0.38 * s, 1.0, 0);
    const arm = new THREE.Mesh(armGeo, shirt); arm.position.y = -0.2; pivot.add(arm);
    const hand = new THREE.Mesh(new THREE.IcosahedronGeometry(0.1, 0), skin); hand.position.y = -0.46; pivot.add(hand);
    if (pose === 'push') { pivot.rotation.x = -Math.PI / 2.1; }
    else if (pose === 'fall') { pivot.rotation.z = s * 2.4; }
    else if (pose === 'cheer') { pivot.rotation.z = s * 2.7; }
    else { pivot.rotation.z = s * 0.18; }
    g.add(pivot);
  }
  // head
  const head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.5, 1), skin); head.position.y = 1.55; head.scale.set(1, 0.95, 0.95); g.add(head);
  const hair = new THREE.Mesh(new THREE.IcosahedronGeometry(0.51, 1), mat(P.hair)); hair.position.set(0, 1.6, -0.16); hair.scale.set(1.0, 0.9, 0.8); g.add(hair);
  // face: eyes
  for (const x of [-0.17, 0.17]) {
    const eye = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.17, 0.05), mat('#1A1A2E')); eye.position.set(x, 1.52, 0.46); g.add(eye);
    const hl = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.05, 0.02), white); hl.position.set(x + 0.015, 1.57, 0.49); g.add(hl);
  }
  const cheek = mat('#F29A8A');
  for (const x of [-0.3, 0.3]) { const ch = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.05, 0.03), cheek); ch.position.set(x, 1.4, 0.4); g.add(ch); }
  // cap
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.53, 8, 5, 0, Math.PI * 2, 0, Math.PI / 2), shirt); cap.position.y = 1.7; cap.scale.y = 0.75; g.add(cap);
  const capBand = new THREE.Mesh(new THREE.CylinderGeometry(0.535, 0.535, 0.1, 8), mat(P.s)); capBand.position.y = 1.72; g.add(capBand);
  const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.46, 0.07, 10, 1, false, -Math.PI / 2, Math.PI), mat(P.s)); brim.position.set(0, 1.69, 0.3); brim.rotation.x = 0.12; g.add(brim);
  const btn = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.06, 0.1), white); btn.position.y = 2.1; g.add(btn);
  if (pose === 'push') g.rotation.x = 0.12;
  return shadow(g);
}

// ---------- text texture helper ----------
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

if (mode === 'char') {
  const id = q.get('id') || 'P1';
  const pose = q.get('pose') || 'idle';
  const ch = makeChar(id, pose); ch.rotation.y = -0.35; scene.add(ch);
  scene.add(new THREE.HemisphereLight('#ffffff', '#3A3F5C', 1.6));
  const d = new THREE.DirectionalLight('#ffffff', 2.2); d.position.set(3, 5, 6); scene.add(d);
  const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 100); cam.position.set(0, 1.5, 6.2); cam.lookAt(0, 1.1, 0);
  renderer.render(scene, cam); window.done = true;
} else {
  const reveal = mode === 'reveal';
  // lights
  scene.add(new THREE.HemisphereLight('#B9C3FF', '#1A1E36', 1.1));
  const sun = new THREE.DirectionalLight('#FFF4E0', 2.4); sun.position.set(6, 16, 10); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 50 });
  scene.add(sun);
  const screenGlow = new THREE.PointLight('#8FA8FF', 30, 22, 1.6); screenGlow.position.set(0, 5, -6); scene.add(screenGlow);

  // stage floor around arena
  const ground = new THREE.Mesh(new THREE.BoxGeometry(60, 1, 40), mat('#151933')); ground.position.y = -1.6; ground.receiveShadow = true; scene.add(ground);
  // arena base
  const base = new THREE.Mesh(new THREE.BoxGeometry(11, 1.2, 11), mat('#232A4D')); base.position.y = -0.6; base.receiveShadow = true; scene.add(base);
  const rim = new THREE.Mesh(new THREE.BoxGeometry(11.4, 0.25, 11.4), mat('#3A4370')); rim.position.y = -0.18; scene.add(rim);
  const top = new THREE.Mesh(new THREE.BoxGeometry(11, 0.05, 11), mat('#2C3460')); top.position.y = 0.0; top.receiveShadow = true; scene.add(top);

  const correct = 'B';
  const plats = { A: [-2.5, -2.5], B: [2.5, -2.5], C: [-2.5, 2.5], D: [2.5, 2.5] };
  for (const [L, [x, z]] of Object.entries(plats)) {
    const isHole = reveal && (L === 'A' || (pts && L === 'D'));
    const isOk = reveal && L === correct;
    if (isHole) {
      const pit = new THREE.Mesh(new THREE.BoxGeometry(4, 0.1, 4), new THREE.MeshBasicMaterial({ color: '#020308' })); pit.position.set(x, 0.03, z); scene.add(pit);
      // open trapdoor halves hanging down
      for (const s of [-1, 1]) {
        const door = new THREE.Mesh(new THREE.BoxGeometry(2, 0.12, 4), mat('#3B4680'));
        const pv = new THREE.Group(); pv.position.set(x + 2 * s, 0.02, z); pv.rotation.z = s * 1.25; door.position.x = -1 * s; pv.add(door); scene.add(pv);
      }
      continue;
    }
    const tex = canvasTex(512, 512, (ctx, w, h) => {
      ctx.fillStyle = isOk ? '#3A3410' : '#3B4680'; ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = isOk ? ACC : '#6A78C0'; ctx.lineWidth = 22; ctx.strokeRect(11, 11, w - 22, h - 22);
      ctx.fillStyle = isOk ? ACC : '#8E9AD8'; ctx.font = '230px Bungee'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(L, w / 2, h / 2 + 10);
    });
    const p = new THREE.Mesh(new THREE.BoxGeometry(4, 0.16, 4), [mat('#2E3768'), mat('#2E3768'), new THREE.MeshLambertMaterial({ map: tex, emissive: isOk ? '#5A4A00' : '#000000' }), mat('#2E3768'), mat('#2E3768'), mat('#2E3768')]);
    p.position.set(x, 0.08, z); p.receiveShadow = true; scene.add(p);
  }

  // telão
  const telTex = canvasTex(1600, 600, (ctx, w, h) => {
    ctx.fillStyle = '#161B33'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = ACC; rr(ctx, 50, 44, 290, 70, 12); ctx.fill();
    ctx.fillStyle = '#141413'; ctx.font = '38px Bungee'; ctx.textBaseline = 'middle'; ctx.fillText('GEOGRAFIA', 72, 82);
    ctx.fillStyle = '#A9B0D6'; ctx.font = '500 34px Rubik'; ctx.fillText(pts ? 'Rodada 6/12 · Vale 200 pts' : 'Rodada 4 · Dificuldade 2', 370, 82);
    if (reveal) { ctx.fillStyle = ACC; ctx.font = '44px Bungee'; ctx.textAlign = 'right'; ctx.fillText('RESPOSTA: B', w - 50, 82); ctx.textAlign = 'left'; }
    else { ctx.strokeStyle = ACC; ctx.lineWidth = 12; ctx.beginPath(); ctx.arc(w - 105, 84, 52, 0, Math.PI * 2); ctx.stroke(); ctx.fillStyle = '#EEF0FF'; ctx.font = '48px Bungee'; ctx.textAlign = 'center'; ctx.fillText('06', w - 105, 88); ctx.textAlign = 'left'; }
    ctx.fillStyle = '#EEF0FF'; ctx.font = '600 64px Rubik'; ctx.fillText('Qual é o maior estado do Brasil em área?', 50, 200);
    const alts = [['A', 'Pará'], ['B', 'Amazonas'], ['C', 'Mato Grosso'], ['D', 'Bahia']];
    alts.forEach(([l, t], i) => {
      const x = 50 + (i % 2) * 760, y = 290 + Math.floor(i / 2) * 140;
      const ok = reveal && l === correct, dim = reveal && !ok;
      ctx.globalAlpha = dim ? 0.4 : 1;
      ctx.fillStyle = ok ? ACC : '#1F2546'; rr(ctx, x, y, 740, 116, 16); ctx.fill();
      ctx.fillStyle = ok ? '#141413' : '#2E3666'; rr(ctx, x + 16, y + 16, 84, 84, 12); ctx.fill();
      ctx.fillStyle = ok ? ACC : '#EEF0FF'; ctx.font = '44px Bungee'; ctx.textAlign = 'center'; ctx.fillText(l, x + 58, y + 62); ctx.textAlign = 'left';
      ctx.fillStyle = ok ? '#141413' : '#EEF0FF'; ctx.font = '500 48px Rubik'; ctx.fillText(t, x + 126, y + 60);
      ctx.globalAlpha = 1;
    });
  });
  const tel = new THREE.Group();
  const frame = new THREE.Mesh(new THREE.BoxGeometry(17, 6.8, 0.5), mat('#2A3157')); tel.add(frame);
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(16, 6), new THREE.MeshBasicMaterial({ map: telTex })); screen.position.z = 0.26; tel.add(screen);
  for (const s of [-1, 1]) { const pole = new THREE.Mesh(new THREE.BoxGeometry(0.5, 8, 0.5), mat('#2A3157')); pole.position.set(7.6 * s, -5, -0.2); tel.add(pole); }
  tel.position.set(0, 5.4, -8.2); tel.rotation.x = 0.18; scene.add(shadow(tel));

  // characters
  const add = (id, pose, x, z, ry, extra = {}) => { const c = makeChar(id, pose); c.scale.setScalar(1.45); c.position.set(x, extra.y ?? 0.16, z); c.rotation.y = ry; if (extra.rx) c.rotation.x = extra.rx; if (extra.rz) c.rotation.z = extra.rz; scene.add(c); return c; };
  if (!reveal) {
    // P1 pushing P2 toward A
    add('P1', 'push', 1.25, -1.9, -Math.PI / 2 - 0.1, { y: 0.03 });
    add('P2', 'idle', -0.55, -2.0, 0.9, { y: 0.03, rz: 0.22 });
    add('P3', 'idle', 3.3, -2.4, 0.2);
    if (pts) add('P4', 'idle', 2.4, 2.3, -0.3);
    // impact puff
    const puff = new THREE.Group();
    for (let i = 0; i < 7; i++) { const b = new THREE.Mesh(new THREE.IcosahedronGeometry(0.12 + Math.random() * 0.1, 0), new THREE.MeshBasicMaterial({ color: i % 2 ? '#FFFFFF' : ACC })); b.position.set((Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.6, (Math.random() - 0.5) * 0.5); puff.add(b); }
    puff.position.set(0.3, 1.45, -1.6); scene.add(puff);
    // motion streaks
    for (let i = 0; i < 3; i++) { const s = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.05, 0.05), new THREE.MeshBasicMaterial({ color: '#F4F5FF' })); s.position.set(-2.0, 1.0 + i * 0.4, -1.8 + i * 0.1); scene.add(s); }
  } else {
    add('P1', 'cheer', 1.6, -2.0, 0.2);
    add('P3', 'idle', 3.3, -2.4, -0.2);
    add('P2', 'fall', -2.4, -2.6, 0.4, { y: -1.25, rx: -0.3 });
    if (pts) add('P4', 'fall', 2.5, 2.4, -0.3, { y: -1.25, rx: -0.3 });
  }

  // spotlight cones for mood
  const cam = new THREE.PerspectiveCamera(42, W / H, 0.1, 200);
  cam.position.set(0, 10.5, 15.5); cam.lookAt(0, 2.6, -2.6);
  renderer.render(scene, cam); window.done = true;
}
</script>
